<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 860" role="img" aria-labelledby="title desc">
  <title id="title">Direction-specific index calculation</title>
  <desc id="desc">Current to destination, 100 to 120, is 20 percent higher. Destination to current, 120 to 100, is 16.7 percent lower. Relative difference equals destination divided by current minus 1 times 100.</desc>
  <rect width="1400" height="860" fill="#e8eeea"/>
  <rect x="86" y="70" width="1228" height="720" rx="38" fill="#25302c"/>
  <rect x="140" y="126" width="540" height="258" rx="22" fill="#303a36" stroke="#66716b" stroke-width="2"/>
  <rect x="720" y="126" width="540" height="258" rx="22" fill="#303a36" stroke="#66716b" stroke-width="2"/>
  <text x="178" y="182" fill="#9caf9f" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" letter-spacing="2.6">CURRENT → DESTINATION</text>
  <text x="758" y="182" fill="#9caf9f" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" letter-spacing="2.6">DESTINATION → CURRENT</text>
  <text x="178" y="290" fill="#fffef9" font-family="Courier New, monospace" font-size="76" font-weight="700">100</text>
  <text x="420" y="290" fill="#9caf9f" font-family="Arial, Helvetica, sans-serif" font-size="58" font-weight="700">→</text>
  <text x="508" y="290" fill="#fffef9" font-family="Courier New, monospace" font-size="76" font-weight="700">120</text>
  <text x="178" y="346" fill="#fffef9" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700">20% HIGHER</text>
  <text x="758" y="290" fill="#fffef9" font-family="Courier New, monospace" font-size="76" font-weight="700">120</text>
  <text x="1000" y="290" fill="#9caf9f" font-family="Arial, Helvetica, sans-serif" font-size="58" font-weight="700">→</text>
  <text x="1088" y="290" fill="#fffef9" font-family="Courier New, monospace" font-size="76" font-weight="700">100</text>
  <text x="758" y="346" fill="#fffef9" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700">16.7% LOWER</text>
  <line x1="140" y1="444" x2="1260" y2="444" stroke="#66716b" stroke-width="2"/>
  <text x="140" y="518" fill="#9caf9f" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" letter-spacing="2.6">RELATIVE DIFFERENCE</text>
  <text x="140" y="600" fill="#fffef9" font-family="Courier New, monospace" font-size="43" font-weight="700">(destination ÷ current − 1) × 100</text>
  <text x="140" y="706" fill="#aeb8b2" font-family="Arial, Helvetica, sans-serif" font-size="25">Always name the starting city.</text>
</svg>
